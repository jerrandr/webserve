<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webserv – Upload de fichiers</title>

  <!-- Icônes Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.0.0/css/all.css" />

  <!-- Notre feuille de style -->
  <link rel="stylesheet" href="upl.css" />
</head>
<body>
  <form class="upload-container" method="post" enctype="multipart/form-data">
    <header class="upload-header">
      <div class="upload-icon">
        <i class="fa-solid fa-upload"></i>
      </div>
      <h1 class="upload-title">Upload de fichier</h1>
    </header>

    <input type="file" id="fileInput" name="monfichier" class="file-input" required />
    <button type="submit" class="upload-btn">
      <i class="fa-solid fa-upload"></i> Envoyer
    </button>
  </form>
</body>
</html>
