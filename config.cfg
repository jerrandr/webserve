server {
    host localhost localhost localhost
    listen 8008 8080
    error_page 404 /error/404.html
    error_page 400 ./400.html
    client_max_body_size 3.2G
    location / {
        method GET
        redirect /
        root /home/ksorokol/GitHub/Webserv/testers/sites/skb/
        autoindex NO
        index index.html
        cgi .php php
        upload no
    }
    location /error {
        method GET
        redirect /
        root /var/www/error/
        autoindex YES
        index index.html
        cgi .php php
        upload no
    }
    location /upload {
        method GET POST DELETE
        root /home/ksorokol/GitHub/Webserv/testers/sites/upload/
        autoindex yes
        cgi .php php
        cgi_path /usr/bin/php-cgi
        cgi_script script-php
        upload yes
    }
    location /upload2 {
        method GET POST
        root /home/ksorokol/GitHub/Webserv/testers/sites/upload/
        autoindex yes
        index index.php
        cgi .php php
        upload yes
    }
}
