server {
    host localhost localhost
    listen 8080 8090
    error_page 404 ./error/404.html
    error_page 400 ./error/400.html
    client_max_body_size 3.2G
    location / {
        root    /home/jerrandr/Videos/webserv
        method GET POST
        cgi .php php
        autoindex YES
        upload  no
    }
    location  /anana {
        method GET POST
        root ./test/
        autoindex YES
        cgi .php php
        upload no
    }

    location /test {
        redirect 302 ///anana
    }
}

