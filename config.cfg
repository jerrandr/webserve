server
{
    host localhost 
    listen 8080
    error_page 404 ./error/404.html
    error_page 400 ./error/400.html
    client_max_body_size 3.2G
    location / {
        method GET
        redirect /
        root /var/www/error/
        autoindex YES
        index index.html
        cgi .php php
    }
}