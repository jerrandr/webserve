server {
    host localhost localhost
    listen 8080 8090 
    error_page 404 ./error/404.html
    error_page 400 ./error/400.html
    client_max_body_size 3.2G
    location / {
        method GET POST DELETE
        root /home/jerrandr/Videos/webserv
        index index.html
        cgi .php php
        upload /upload/
    }

    location /dir/ {
        method GET POST DELETE
        root /home/jerrandr/Videos/webserv
        autoindex YES
        cgi .php php
        upload /upload/
    }
    location /web/dir {
        redirect 6000 /dir
    }
}