server {
    host localhost localhost
    listen 8080 8090 
    error_page 404 ./error/404.html
    error_page 400 ./error/400.html
    client_max_body_size 3.2G
    location / {
        method GET POST DELETE
        root ./www/webi/
        index index.html
        cgi .php
        cgi_path /usr/bin/php-cgi
        upload /upload/
    }

    location /dir/ {
        method GET POST DELETE
        root ./www/webi/
        autoindex YES
        cgi .php
        cgi_path /usr/bin/php-cgi
        upload /upload/
    }
    location /web/dir {
        redirect 6000 /dir
    }
}