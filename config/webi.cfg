server {
    host localhost localhost
    listen 8080 8090 
    error_page 404 ./error/404.html
    error_page 400 ./error/400.html
    location / {
        method GET POST DELETE 
        root ./www/webi/
        index index.html
        cgi .php
        cgi_path /usr/bin/php-cgi
        upload /upload/
    }

    location /dir/ {
        method GET POST DELETE
        root ./www/
        autoindex YES
        cgi .php
        cgi_path /usr/bin/php-cgi
        upload /upload/
    }
    location /home/int {
        method GET POST DELETE 
        root ./www/webi/
        index index.html
    }
    location /redir_int {
        redirect 307 /
    }
    location /redir_ext {
        redirect 307 https://zzz.zoomquilt.org/
    }
}