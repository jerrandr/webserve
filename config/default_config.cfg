server {
    host localhost localhost
    listen 8080 8090 
    error_page 404 ./error/404.html
    error_page 400 ./error/400.html
    client_max_body_size 3.2G
    location / {
        method GET POST
        root ./www/
        autoindex YES
        cgi .php php
        upload /path_upload
    }

    location /dir/ {
        redirect 301 /
    }
}