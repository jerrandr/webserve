server
{
    host localhost
    listen 8080
    error_page 404 ./error/404.html
    error_page 400 ./error/400.html
    client_max_body_size 32G
    location / {
        method POST DELETE GET
        autoindex YES
        root ./www/
        cgi .php .php
        upload upload/
    }

    location /dir/ {
        root ./
        autoindex YES
    }
}