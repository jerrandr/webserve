server
{
    host localhost localhost
    listen  8080 8090
    error_page 404 ./error/404.html
    error_page 400 ./error/400.html
    location / {
        method GET POST DELETE
        root ./www/
        index 1.jpg
        cgi .php .php
        upload upload/
    }
    location /test/var {
        method GET POST DELETE
        root ./www/webi/
        autoindex YES
    }
    location /dir/ {
        redirect 301 /
    }
}