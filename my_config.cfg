server {
    host localhost localhost
    listen 8080 8090
    error_page 400 ./error/400.html
    client_max_body_size 3.2G
    location / {
        root    /home/jerry/cursus/webserve
        method GET POST
        cgi .php
        autoindex YES
        upload  /upload
    }
    location  /dir/ {
        redirect 301 /
    }
}
